<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Polymedica Тетрис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: чистая, дружелюбная клиника — бело-синий, спокойно и бодро
   IDEA: экран медицинского монитора: кардиограмма, карта пациента, блоки-лекарства
   PICTURE: игровое поле во весь экран, фигуры — шприц, аптечка, капсулы, капельница
   COLOUR and TYPE: фирменный синий #1f6fd1, белый, акцент — красный крест; Manrope
   LAYOUT: шапка с логотипом и показателями, поле по центру, подсказка снизу */
:root{color-scheme:light dark;
--bg:light-dark(#eaf3fd,#06182e);--panel:light-dark(#ffffff,#0d2443);--ink:light-dark(#0b2a4f,#e6f0fc);
--mute:light-dark(#5a7598,#8fa8c8);--blue:#1f6fd1;--board:light-dark(#ffffff,#0a1f3a);--grid:light-dark(#e3edf9,#14304f);--red:#e5484d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Manrope,system-ui,sans-serif;overflow:hidden;
user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:18px;padding:8px 10px;
box-shadow:0 4px 18px -8px rgba(20,70,140,.35)}
header img{width:44px;height:44px;flex:none}
.brand{flex:1}
.brand b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--blue);line-height:1.05}
.brand span{font-size:13px;color:var(--mute)}
.next{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--mute)}
.next canvas{width:64px;height:40px}
#pause{width:44px;height:44px;border:0;border-radius:14px;background:var(--bg);color:var(--blue);font:800 18px Manrope;flex:none;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0 6px}
.stats div{background:var(--panel);border-radius:12px;padding:5px 8px;text-align:center}
.stats small{display:block;font-size:13px;color:var(--mute)}
.stats strong{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.ecg{height:26px;overflow:hidden;position:relative;margin-bottom:6px}
.ecg svg{position:absolute;left:0;top:0;height:26px;width:200%;animation:run 3s linear infinite}
.ecg path{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;opacity:.55;transition:stroke .2s}
.ecg.beat path{stroke:var(--red);opacity:1;stroke-width:2.6}
@keyframes run{to{transform:translateX(-50%)}}
#play{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
#board{border-radius:14px;background:var(--board);box-shadow:0 10px 30px -12px rgba(20,70,140,.45),inset 0 0 0 2px var(--grid)}
.hint{text-align:center;font-size:13px;color:var(--mute);padding-top:6px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.card{background:var(--panel);border-radius:22px;padding:22px 20px;text-align:center;max-width:300px;width:100%;
box-shadow:0 20px 50px -18px rgba(10,50,110,.55)}
.card img{width:72px;height:72px}
.card h2{margin:6px 0 4px;font-size:26px;line-height:1.1;font-weight:800;color:var(--blue)}
.card p{margin:0 0 14px;color:var(--mute);font-size:15px}
.card ul{list-style:none;padding:0;margin:0 0 16px;text-align:left;font-size:15px}
.card li{display:flex;gap:10px;align-items:center;padding:4px 0}
.card li i{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--blue)}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:800 17px Manrope;cursor:pointer;box-shadow:0 6px 16px -6px var(--blue)}
.btn:focus-visible,#pause:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.big{font-size:40px;font-weight:800;color:var(--ink);margin:4px 0}
@media(prefers-reduced-motion:reduce){.ecg svg{animation:none}}
</style>
</head>

const nextBag=()=>{if(!bag.length){bag=Object.keys(P);for(let i=bag.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()};
function spawn(){
  const k=nextK||nextBag();nextK=nextBag();
  const m=P[k].m.map(r=>r.slice());
  cur={k,m,x:(COLS-m.length)/2|0,y:k==='I'?-1:0};
  lockT=0;lockMoves=0;
  if(hit(cur.m,cur.x,cur.y))over();
  drawNext();
}
function hit(m,x,y){
  for(let r=0;r<m.length;r++)for(let c=0;c<m.length;c++)if(m[r][c]){
    const X=x+c,Y=y+r;if(X<0||X>=COLS||Y>=ROWS)return true;if(Y>=0&&grid[Y][X])return true}
  return false;
}
function move(dx,dy){
  if(state!=='play'||clearing)return false;
  if(!hit(cur.m,cur.x+dx,cur.y+dy)){cur.x+=dx;cur.y+=dy;if(dx&&lockMoves<15){lockT=0;lockMoves++}return true}
  return false;
}
function rotate(){
  if(state!=='play'||clearing)return;
  const n=cur.m.length,m=cur.m.map((r,i)=>r.map((_,j)=>cur.m[n-1-j][i]));
  for(const [kx,ky] of [[0,0],[-1,0],[1,0],[0,-1],[-2,0],[2,0]])
    if(!hit(m,cur.x+kx,cur.y+ky)){cur.m=m;cur.x+=kx;cur.y+=ky;if(lockMoves<15){lockT=0;lockMoves++}buzz(8);return}
}
function hard(){
  if(state!=='play'||clearing)return;
  let d=0;while(!hit(cur.m,cur.x,cur.y+1)){cur.y++;d++}
  score+=d*2;lock();buzz(15);
}
function lock(){
  let top=false;
  cur.m.forEach((r,i)=>r.forEach((v,j)=>{if(v){const Y=cur.y+i;if(Y<0)top=true;else grid[Y][cur.x+j]=cur.k}}));
  if(top)return over();
  const full=[];for(let y=0;y<ROWS;y++)if(grid[y].every(Boolean))full.push(y);
  if(full.length){
    clearing={rows:full,t:0};
    score+=[0,100,300,500,800][full.length]*level;lines+=full.length;
    level=1+Math.floor(lines/10);
    full.forEach(y=>{for(let x=0;x<COLS;x++)for(let k=0;k<2;k++)parts.push({x:(x+.5)*cell,y:(y+.5)*cell,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,l:1,c:P[grid[y][x]].c})});
    const e=$('ecg');e.classList.add('beat');setTimeout(()=>e.classList.remove('beat'),600);
    beep(full.length);buzz(30);
  } else spawn();
  hud();
}
function finishClear(){
  for(const y of clearing.rows){grid.splice(y,1);grid.unshift(Array(COLS).fill(0))}
  clearing=null;spawn();
}
function hud(){$('score').textContent=score;$('level').textContent=level;$('lines').textContent=lines}
function over(){
  state='over';
  if(score>best){best=score;try{localStorage.setItem('pm_tetris_best',best)}catch(e){}$('best').textContent=best}
  card(`<img src="${LOGO}" alt=""><h2>Приём окончен</h2><p>Вылечено пациентов: ${lines}</p><div class="big">${score}</div><p>${score>=best&&score>0?'Новый рекорд клиники!':'Рекорд: '+best}</p><button class="btn" id="go">Новый приём</button>`);
}
function start(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  score=0;lines=0;level=1;bag=[];nextK=null;parts=[];clearing=null;acc=0;
  hud();spawn();state='play';$('ov').hidden=true;$('pause').textContent='II';
}
function card(h){$('card').innerHTML=h;$('ov').hidden=false;const b=$('go');if(b){b.onclick=e=>{e.stopPropagation();state==='pause'?resume():start()}}}
function pause(){if(state!=='play')return;state='pause';$('pause').textContent='▶';
  card(`<img src="${LOGO}" alt=""><h2>Перерыв</h2><p>Доктор скоро вернётся</p><button class="btn" id="go">Продолжить</button>`)}
function resume(){state='play';$('ov').hidden=true;$('pause').textContent='II';last=performance.now()}
function menu(){
  card(`<img src="${LOGO}" alt=""><h2>Polymedica</h2><p>Соберите полную линию — пациент здоров!</p>
  <ul><li><i>↔</i>Свайп влево или вправо — сдвиг</li><li><i>↓</i>Резкий свайп вниз — сброс</li><li><i>⟳</i>Тап по экрану — поворот</li></ul>
  <button class="btn" id="go">Начать приём</button>`);
}

/* drawing */
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)}
function glyph(c,g,x,y,s){
  const m=s/2,cxp=x+m,cyp=y+m,u=s*.13;
  c.fillStyle='rgba(255,255,255,.92)';c.strokeStyle='rgba(255,255,255,.92)';c.lineCap='round';
  if(g==='cross'){c.fillRect(cxp-u*.9,cyp-u*2.4,u*1.8,u*4.8);c.fillRect(cxp-u*2.4,cyp-u*.9,u*4.8,u*1.8)}
  else if(g==='plus'){c.lineWidth=u*1.1;c.beginPath();c.moveTo(cxp-u*1.8,cyp);c.lineTo(cxp+u*1.8,cyp);c.moveTo(cxp,cyp-u*1.8);c.lineTo(cxp,cyp+u*1.8);c.stroke()}
  else if(g==='pill'){c.save();c.translate(cxp,cyp);c.rotate(-.7);rr(c,-u*2.6,-u*1.1,u*5.2,u*2.2,u*1.1);c.fill();c.fillStyle='rgba(0,0,0,.18)';c.fillRect(0,-u*1.1,u*.35,u*2.2);c.restore()}
  else if(g==='dot'){c.beginPath();c.arc(cxp,cyp,u*2.2,0,7);c.fill();c.fillStyle='rgba(0,0,0,.2)';c.fillRect(cxp-u*1.6,cyp-u*.2,u*3.2,u*.4)}
  else if(g==='drop'){c.beginPath();c.moveTo(cxp,cyp-u*2.6);c.bezierCurveTo(cxp+u*2.6,cyp,cxp+u*2,cyp+u*2.4,cxp,cyp+u*2.4);c.bezierCurveTo(cxp-u*2,cyp+u*2.4,cxp-u*2.6,cyp,cxp,cyp-u*2.6);c.fill()}
  else if(g==='heart'){c.beginPath();c.moveTo(cxp,cyp+u*2.2);c.bezierCurveTo(cxp-u*3.2,cyp,cxp-u*1.6,cyp-u*2.8,cxp,cyp-u*1);c.bezierCurveTo(cxp+u*1.6,cyp-u*2.8,cxp+u*3.2,cyp,cxp,cyp+u*2.2);c.fill()}
  else if(g==='line'){c.lineWidth=u*.8;c.beginPath();c.moveTo(x+s*.15,cyp);c.lineTo(x+s*.85,cyp);c.stroke();c.lineWidth=u*.5;for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(cxp+i*u*1.6,cyp-u*1.3);c.lineTo(cxp+i*u*1.6,cyp);c.stroke()}}
}
function tile(c,k,x,y,s,alpha){
  const p=P[k],g=s*.06;c.globalAlpha=alpha||1;
  const gr=c.createLinearGradient(x,y,x,y+s);gr.addColorStop(0,shade(p.c,28));gr.addColorStop(1,shade(p.c,-18));
  c.fillStyle=gr;rr(c,x+g,y+g,s-2*g,s-2*g,s*.22);c.fill();
  c.fillStyle='rgba(255,255,255,.28)';rr(c,x+g*2,y+g*2,s-4*g,s*.28,s*.14);c.fill();
  glyph(c,p.g,x,y,s);c.globalAlpha=1;
}
function shade(h,a){const n=parseInt(h.slice(1),16);const f=v=>Math.max(0,Math.min(255,v+a));
  return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
function draw(){
  if(!grid){cx.clearRect(0,0,cv.width,cv.height);return}
  const W=cell*COLS,H=cell*ROWS,cs=getComputedStyle(document.documentElement);
  cx.clearRect(0,0,W,H);
  cx.strokeStyle=cs.getPropertyValue('--grid');cx.lineWidth=1;cx.beginPath();
  for(let x=1;x<COLS;x++){cx.moveTo(x*cell+.5,0);cx.lineTo(x*cell+.5,H)}
  for(let y=1;y<ROWS;y++){cx.moveTo(0,y*cell+.5);cx.lineTo(W,y*cell+.5)}cx.stroke();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(grid[y][x]){
    if(clearing&&clearing.rows.includes(y)){const t=clearing.t/260;cx.fillStyle=`rgba(255,255,255,${1-t})`;tile(cx,grid[y][x],x*cell,y*cell,cell,1-t);rr(cx,x*cell,y*cell,cell,cell,4);cx.fill()}
    else tile(cx,grid[y][x],x*cell,y*cell,cell);
  }
  if(cur&&!clearing&&state!=='menu'){
    cur.m.forEach((r,i)=>r.forEach((v,j)=>{if(v&&cur.y+i>=0)tile(cx,cur.k,(cur.x+j)*cell,(cur.y+i)*cell,cell)}));
  }
  for(const p of parts){cx.globalAlpha=Math.max(0,p.l);cx.fillStyle=p.c;const s=cell*.22;cx.fillRect(p.x-s/3,p.y-s,s*.66,s*2);cx.fillRect(p.x-s,p.y-s/3,s*2,s*.66)}
  cx.globalAlpha=1;
}
function drawNext(){
  const d=nv.width,h=nv.height;nx.clearRect(0,0,d,h);if(!nextK)return;
  const m=P[nextK].m.filter(r=>r.some(Boolean)),cols=m[0].length,s=Math.min(30,(d-8)/cols,(h-8)/m.length);
  const w=m[0].reduce((a,_,j)=>m.some(r=>r[j])?a+1:a,0),off=m[0].findIndex((_,j)=>m.some(r=>r[j]));
  m.forEach((r,i)=>r.forEach((v,j)=>{if(v)tile(nx,nextK,(d-w*s)/2+(j-off)*s,(h-m.length*s)/2+i*s,s)}));
  $('nextName').textContent=P[nextK].n;
}
function loop(t){
  const dt=Math.min(100,t-(last||t));last=t;
  if(state==='play'){
    if(clearing){clearing.t+=dt;if(clearing.t>=260)finishClear()}
    else{
      acc+=dt;const iv=Math.max(70,800-(level-1)*75);
      if(hit(cur.m,cur.x,cur.y+1)){lockT+=dt;if(lockT>450)lock()}
      else{lockT=0;while(acc>=iv){acc-=iv;if(!move(0,1))break}}
      if(acc>iv)acc=iv;
    }
  }
  parts=parts.filter(p=>(p.x+=p.vx,p.y+=p.vy,p.vy+=.25,p.l-=.025)>0);
  draw();requestAnimationFrame(loop);
}

/* input */
let T=null;
addEventListener('touchstart',e=>{
  if(e.target.closest('button'))return;e.preventDefault();
  const p=e.touches[0];T={x0:p.clientX,y0:p.clientY,sx:p.clientX,sy:p.clientY,t:performance.now(),moved:false};
},{passive:false});
addEventListener('touchmove',e=>{
  if(!T)return;e.preventDefault();const p=e.touches[0],step=cell*.9;
  while(p.clientX-T.sx>=step){move(1,0);T.sx+=step;T.moved=true}
  while(T.sx-p.clientX>=step){move(-1,0);T.sx-=step;T.moved=true}
  const dy=p.clientY-T.y0,dx=Math.abs(p.clientX-T.x0);
  if(dy>cell*1.5&&dy>dx*1.5){while(p.clientY-T.sy>=cell*1.5+cell){if(move(0,1))score++;T.sy+=cell;T.moved=true}}
  if(Math.abs(p.clientX-T.x0)>10||Math.abs(dy)>10)T.moved=true;
},{passive:false});
addEventListener('touchend',e=>{
  if(!T)return;const p=e.changedTouches[0],dx=p.clientX-T.x0,dy=p.clientY-T.y0,dt=performance.now()-T.t;
  if(dy>50&&dy>Math.abs(dx)*1.3&&dy/dt>.6)hard();
  else if(!T.moved&&dt<350)rotate();
  else if(dy<-50&&Math.abs(dy)>Math.abs(dx)*1.3)rotate();
  T=null;hud();
});
cv.addEventListener('mousedown',e=>{if(!('ontouchstart' in window))rotate()});
addEventListener('keydown',e=>{
  const k=e.key;
  if(!$('ov').hidden&&(k==='Enter'||k===' ')){e.preventDefault();$('go').click();return}
  if(k==='ArrowLeft')move(-1,0);else if(k==='ArrowRight')move(1,0);
  else if(k==='ArrowDown'){if(move(0,1))score++}else if(k==='ArrowUp'||k==='x')rotate();
  else if(k===' '){if(state==='play')hard();else return}
  else if(k==='p'||k==='Escape')state==='play'?pause():state==='pause'&&resume();else return;
  e.preventDefault();hud();
});
$('pause').onclick=()=>state==='play'?pause():state==='pause'?resume():0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

let ac=null;
function beep(n){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;
  for(let i=0;i<n+1;i++){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=660+i*220;
  g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.12,t+i*.09+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.12);
  o.connect(g).connect(ac.destination);o.start(t+i*.09);o.stop(t+i*.09+.14)}}catch(e){}}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

new ResizeObserver(fit).observe($('play'));
fit();menu();requestAnimationFrame(loop);
}
</script>
</body>
