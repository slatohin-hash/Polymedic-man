  cv.width = Math.round(innerWidth*dpr); cv.height = Math.round(innerHeight*dpr);
  S = Math.min(cv.height / H, cv.width / 460);
  W = cv.width / S; VH = cv.height / S; OY = VH - H;
  PX = W < 600 ? 95 : 150;
}
addEventListener('resize', resize); resize();

// ---------------- audio ----------------
let ac = null;
function beep(f1,f2,dur,type='square',vol=.07){
  if(!ac) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
    o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(t+dur);
  }catch(e){}
}
function melody(notes,gap=120){ notes.forEach((f,i)=>setTimeout(()=>beep(f,f,.16,'triangle',.07),i*gap)); }

let state = 'menu'; // menu | play | done | over | win

function L(){ return LEVELS[G.lvl]; }
function D(){ return DIFFS[diff]; }

  if(!keepScore){ runScore = 0; }

    p:{y:GROUND, vy:0, air:false, jumps:0, rot:0, tilt:0, fall:false},
    obs:[], items:[], parts:[], floaters:[], wx:[],
    nextObs:520, nextItem:300, finished:false, logos:0, endAt:0
  };

}

// ---------------- input ----------------
let buttons = [];
function btn(x,y,w,h,label,fn,opt={}){ buttons.push({x,y,w,h,fn});
  rr(x,y,w,h,opt.r ?? h/2);
  ctx.fillStyle = opt.fill || '#1f6fc5'; ctx.fill();
  if(opt.stroke){ ctx.strokeStyle=opt.stroke; ctx.lineWidth=2; ctx.stroke(); }
  ctx.fillStyle = opt.color || '#fff'; ctx.font = opt.font || '700 17px Rubik, sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, x+w/2, y+h/2+ (opt.dy ?? 6));
}
function press(cx, cy){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state==='suspended') ac.resume().catch(()=>{});
  const dpr = cv.width / innerWidth;
  const x = cx*dpr/S, y = cy*dpr/S;
  if(state!=='play'){
    if(state!=='menu' && T - (G.endAt||0) < .5) return;
    for(const b of buttons) if(x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ b.fn(); return; }
    return;
  }
  jump();
}
function jump(){
  const p = G.p; if(G.finished || p.fall) return;
  if(!p.air){ p.vy=-560; p.air=true; p.jumps=1; beep(300,700,.12); dust(PX,GROUND,6); }
  else if(p.jumps<2){ p.vy=-470; p.jumps=2; beep(500,1000,.1); }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(e.clientX, e.clientY); });
addEventListener('keydown', e => {
  if(['Space','ArrowUp','Enter'].includes(e.code)){ e.preventDefault();
    if(state==='play') jump();
    else if(buttons.length && T - (G.endAt||0) > .5) buttons[buttons.length-1].fn();
  }
});

// ---------------- helpers ----------------
function rr(x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function logo(x,y,s){ if(LOGO.complete && LOGO.naturalWidth) ctx.drawImage(LOGO,x-s/2,y-s/2,s,s); }
function hash(i){ const v = Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); }
function dust(x,y,n,c){ for(let i=0;i<n;i++) G.parts.push({x,y,vx:-60-Math.random()*120,vy:-Math.random()*120,life:.5+Math.random()*.3,c:c||'rgba(180,160,130,'}); }
function pickMix(mix){ let r=Math.random(), acc=0; for(const k in mix){ acc+=mix[k]; if(r<=acc) return k; } return 'bump'; }
function profile(o,x){
  const u=(x-o.x)/o.w; if(u<0||u>1) return 0;
  if(o.type==='bump') return Math.sin(u*Math.PI)*o.h;
  if(o.type==='bush'){ if(u<.06||u>.94) return 0; const k=(u-.5)*2; return Math.sqrt(Math.max(0,1-k*k))*o.h; }
  return 0;
}
function goalScreenX(){ return (L().len - G.dist)*PX_PER_M + PX - 110; }

// ---------------- update ----------------
function spawnObstacle(x){
  const lv=L(), d=D(), n=G.lvl;
  const type = pickMix(lv.mix);
  let o;
  if(type==='bump') o={type, w:(44+Math.random()*36)*d.size, h:(16+Math.random()*14+n*2)*d.size};
  else if(type==='bush') o={type, w:(40+Math.random()*24)*d.size, h:(30+Math.random()*12+n*2.5)*d.size};
  else o={type:'pit', w:(64+Math.random()*40+n*9)*d.size, h:0};
  o.x=x; o.hit=false; o.seed=Math.random()*100;
  G.obs.push(o);
  return o;
}
function update(dt){
  T += dt;
  if(G) G.t += dt;
  updParts(dt);
  if(state==='menu'){ G.dist += 120*dt/PX_PER_M; G.p.rot += 120*dt/14; return; }
  if(state!=='play') return;
  const lv=L(), d=D(), p=G.p;
  const prog = Math.min(1, G.dist/lv.len);
  if(G.finished) G.speed = Math.max(0, G.speed - 320*dt);
  else G.speed = (lv.v[0] + (lv.v[1]-lv.v[0])*prog) * d.speed;
  const dx = G.speed*dt;
  G.dist += dx/PX_PER_M;

  const gx = goalScreenX();
  G.nextObs -= dx; G.nextItem -= dx;
  if(G.nextObs<=0 && gx > W+320){
    const o = spawnObstacle(W+40);
    if(Math.random() < lv.combo){ spawnObstacle(W+40+o.w+110+Math.random()*40+G.speed*.12); }
    G.nextObs = ((lv.gap[0] + Math.random()*(lv.gap[1]-lv.gap[0])) * d.gap) + G.speed*.3;
  }
  if(G.nextItem<=0 && gx > W+220){
    if(G.lives < d.lives && Math.random()<.18){
      G.items.push({type:'heart', x:W+30, y:GROUND-110-Math.random()*40, ph:Math.random()*6});
    } else {
      const k=1+(Math.random()*4|0), y0=GROUND-60-Math.random()*90, arc=Math.random()<.5;
      for(let i=0;i<k;i++) G.items.push({type:'logo', x:W+30+i*42, y:y0-(arc?Math.sin(i/Math.max(1,k-1)*Math.PI)*40:0), ph:Math.random()*6});
    }
    G.nextItem = 260 + Math.random()*400;
  }
  for(const o of G.obs) o.x -= dx;
  for(const it of G.items) it.x -= dx;
  G.obs = G.obs.filter(o=>o.x+o.w>-60);
  G.items = G.items.filter(it=>it.x>-50 && !it.gone);

  // physics
  const pit = G.obs.find(o=>o.type==='pit' && !o.hit && PX > o.x+16 && PX < o.x+o.w-16);
  const solid = !(pit && G.inv<=0 && !G.finished);
  p.vy += 1500*dt; p.y += p.vy*dt;
  if(p.y >= GROUND && solid && !p.fall){
    if(p.air && p.vy>200) dust(PX,GROUND,5);
    p.y=GROUND; p.vy=0; p.air=false; p.jumps=0;
  } else if(p.y > GROUND+4 && !solid && !p.fall){ p.fall = true; p.air = true; G.fallPit = pit; }
  if(p.fall && p.y > GROUND+70){
    if(G.fallPit) G.fallPit.hit = true;
    hurt();
    p.fall=false; p.y=GROUND-60; p.vy=-260; p.air=true; p.jumps=2;
  }
  p.rot += dx/14;
  p.tilt += ((p.air ? Math.max(-.35,Math.min(.35,p.vy/1400)) : 0) - p.tilt)*Math.min(1,dt*10);
  if(G.inv>0) G.inv -= dt;

  if(!G.finished && !p.fall){
    for(const o of G.obs){
      if(o.hit || o.type==='pit') continue;
      for(const wx of [PX-26, PX+26]){
        const hh=profile(o,wx);
        if(hh>4 && p.y > GROUND-hh+5){
          o.hit=true;
          if(G.inv<=0){ hurt(); p.vy=-380; p.air=true; p.jumps=2;
            dust(PX,GROUND-10,14, o.type==='bush' ? 'rgba(70,150,70,' : 'rgba(120,90,60,'); }
          break;
        }
      }
    }
    for(const it of G.items){
      const iy = it.y + Math.sin(G.t*4+it.ph)*4;
      if(Math.abs(it.x-PX)<32 && Math.abs(iy-(p.y-50))<44){
        it.gone=true;
        if(it.type==='heart'){ G.lives=Math.min(d.lives,G.lives+1); beep(600,1200,.2,'triangle',.08); G.floaters.push({x:it.x,y:iy,t:0,txt:'+1 ♥',c:'#e53950'}); }
        else { runScore+=10; G.logos++; beep(880,1600,.08,'triangle',.06); G.floaters.push({x:it.x,y:iy,t:0,txt:'+10',c:'#1f6fc5'});
          for(let i=0;i<8;i++) G.parts.push({x:it.x,y:iy,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:.4,c:'rgba(60,150,230,'}); }
      }
    }
  }
  if(!G.finished && (lv.len-G.dist)*PX_PER_M <= G.speed*G.speed/640) G.finished = true;
  if(G.finished && G.speed<=0){ G.arrT=(G.arrT||0)+dt; if(G.arrT>1.4) levelComplete(); }
  if(G.shake>0) G.shake-=dt;
  runScore = Math.max(runScore, 0);
}
function hurt(){
  if(G.inv>0) return;
  G.lives--; G.inv=1.5; G.shake=.35; beep(200,60,.35,'sawtooth',.09);
  if(G.lives<=0) gameOver();
}
function updParts(dt){
  for(const q of G.parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=400*dt; q.life-=dt; }
  G.parts = G.parts.filter(q=>q.life>0);
  for(const f of G.floaters){ f.t+=dt; f.y-=40*dt; }
  G.floaters = G.floaters.filter(f=>f.t<.8);
  // weather
  const w = (LEVELS[G.lvl]||{}).weather;
  if(w==='snow' && G.wx.length<90) G.wx.push({x:Math.random()*W, y:-OY-10, vx:-30-Math.random()*40, vy:40+Math.random()*50, r:1+Math.random()*2.5});
  if(w==='leaves' && G.wx.length<14 && Math.random()<.05) G.wx.push({x:W+10, y:-OY*0.5+Math.random()*(GROUND-60+OY*0.5), vx:-80-Math.random()*80, vy:20+Math.random()*30, r:4+Math.random()*3, a:Math.random()*6, c:Math.random()<.5?'#e3b33c':'#7fc24a'});
  for(const q of G.wx){ q.x += (q.vx - (state==='play'?G.speed*.3:20))*dt; q.y += q.vy*dt + Math.sin(T*2+q.r*10)*0.3; if(q.a!==undefined) q.a+=dt*3; }
  G.wx = G.wx.filter(q=>q.y<GROUND+10 && q.x>-20);
}
function levelComplete(){
  const bonus = 100*(G.lvl+1) + 50*G.lives;
  runScore += bonus; G.bonus = bonus;
  state = (G.lvl === LEVELS.length-1) ? 'win' : 'done';
  G.endAt = T;
  if(G.lvl+2 > unlocked && G.lvl+1 < LEVELS.length){ unlocked = G.lvl+2; store.set('unlocked', unlocked); }
  if(state==='win'){ unlocked = LEVELS.length; store.set('unlocked', unlocked); }
  saveBest();
  melody(state==='win' ? [523,659,784,1046,784,1046,1318] : [523,659,784,1046]);
}
function gameOver(){
  state='over'; G.endAt=T; saveBest(); beep(300,80,.6,'sawtooth',.08);
}
function saveBest(){ G.newBest = runScore > best; if(G.newBest){ best = runScore; store.set('best', best); } }

// ---------------- background drawing ----------------
function drawSky(lv){
  const g = ctx.createLinearGradient(0,-OY,0,GROUND);
  g.addColorStop(0, lv.sky[0]); g.addColorStop(1, lv.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,-OY,W,GROUND+OY);
  const off = G.dist*PX_PER_M;
  if(lv.weather==='stars'){
    for(let i=0;i<70;i++){ const x=(hash(i)*W*1.3 - off*0.02)%(W); const y=-OY+hash(i+50)*(GROUND*0.6+OY);
      ctx.globalAlpha=.4+.6*Math.abs(Math.sin(T*1.5+i)); ctx.fillStyle='#fff'; ctx.fillRect((x+W)%W,y,1.8,1.8); }
    ctx.globalAlpha=1;
  }
  // celestial: the logo
  const sx = OY>60 ? W-80 : W-190, sy = OY>60 ? -OY*0.35 : 105;
  let glow='rgba(255,250,200,', size=62, gr=70;
  if(lv.cel==='sunset'){ glow='rgba(255,200,120,'; size=90; gr=140; }
  if(lv.cel==='moon'){ glow='rgba(170,200,255,'; size=60; gr=110; }
  if(lv.cel==='pale'){ glow='rgba(255,255,255,'; size=54; gr=60; }
  const cy = lv.cel==='sunset' ? (OY>60? -OY*0.1+60 : 150) : sy;
  const gl = ctx.createRadialGradient(sx,cy,10,sx,cy,gr); gl.addColorStop(0,glow+'.9)'); gl.addColorStop(1,glow+'0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(sx,cy,gr,0,7); ctx.fill();
  ctx.save(); ctx.translate(sx,cy); ctx.rotate(T*0.25); if(lv.cel==='pale') ctx.globalAlpha=.75; logo(0,0,size); ctx.restore();
  // clouds
  if(lv.cel!=='moon'){
    ctx.fillStyle = lv.cel==='sunset' ? 'rgba(255,220,200,.75)' : 'rgba(255,255,255,.85)';
    for(let i=0;i<6;i++){
      const x=((i*260 - off*0.05)%(W+300)+W+300)%(W+300)-150, y=(OY>60? -OY*0.5:0)+40+(i*53%90);
      ctx.beginPath(); ctx.ellipse(x,y,46,16,0,0,7); ctx.ellipse(x+28,y-10,28,18,0,0,7); ctx.ellipse(x-24,y-4,24,14,0,0,7); ctx.fill();
    }
  }
  // blimp
  const bx = (W+200) - (T*25 % (W+400)), by = OY>60 ? -OY*0.7+20 : 112;
  ctx.fillStyle = lv.night ? '#dfe6ff' : '#fff'; ctx.beginPath(); ctx.ellipse(bx,by,62,21,0,0,7); ctx.fill();
  ctx.strokeStyle='#1f6fc5'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#1f6fc5'; ctx.beginPath(); ctx.moveTo(bx+52,by); ctx.lineTo(bx+74,by-16); ctx.lineTo(bx+74,by+16); ctx.closePath(); ctx.fill();
  ctx.fillRect(bx-12,by+19,24,8);
  logo(bx-34,by,30); ctx.font='900 11px Rubik, sans-serif'; ctx.textAlign='left'; ctx.fillText('POLYMEDICA',bx-16,by+4);
}
function drawFar(lv){
  const f = lv.far; if(!f) return;
  const off = G.dist*PX_PER_M*0.12;
  ctx.fillStyle = f.c;
  if(f.type==='hills'){
    ctx.beginPath(); ctx.moveTo(0,GROUND);
    for(let x=0;x<=W+10;x+=10){ const X=x+off; ctx.lineTo(x, GROUND-70 - Math.sin(X*0.006)*30 - Math.sin(X*0.013+1)*14); }
    ctx.lineTo(W,GROUND); ctx.fill();
  } else {
    const seg=200, st=Math.floor(off/seg)-1;
    for(let i=st;i<st+Math.ceil(W/seg)+3;i++){
      const x=i*seg-off, h=120+hash(i)*110, w=seg*1.6;
      ctx.fillStyle=f.c; ctx.beginPath(); ctx.moveTo(x-w/2,GROUND); ctx.lineTo(x,GROUND-h); ctx.lineTo(x+w/2,GROUND); ctx.fill();
      if(f.snow){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(x,GROUND-h); ctx.lineTo(x-w*0.11,GROUND-h+h*0.22); ctx.lineTo(x-w*0.03,GROUND-h+h*0.17); ctx.lineTo(x+w*0.03,GROUND-h+h*0.24); ctx.lineTo(x+w*0.11,GROUND-h+h*0.22); ctx.closePath(); ctx.fill(); }
    }
  }
}
function drawMid(lv){
  const off = G.dist*PX_PER_M*0.28;
  const seg = lv.mid==='city'||lv.mid==='neon' ? 70 : 90;
  const st = Math.floor(off/seg)-1;
  for(let i=st;i<st+Math.ceil(W/seg)+3;i++){
    const r=hash(i), x=i*seg-off;
    if(lv.mid==='city'){
      const h=60+r*110, w=50+hash(i+7)*20;
      ctx.fillStyle = r>.5 ? '#9cc3e6' : '#86b1d9'; ctx.fillRect(x,GROUND-30-h,w,h+30);
      ctx.fillStyle='rgba(255,255,255,.45)';
      for(let wy=GROUND-20-h; wy<GROUND-40; wy+=18) for(let wx=x+8; wx<x+w-10; wx+=14) ctx.fillRect(wx,wy,7,9);
      if(i%5===0) logo(x+w/2, GROUND-30-h-16, 26);
    } else if(lv.mid==='neon'){
      const h=80+r*130, w=52+hash(i+7)*22;
      ctx.fillStyle = r>.5 ? '#151a3a' : '#1b2148'; ctx.fillRect(x,GROUND-30-h,w,h+30);
      for(let wy=GROUND-20-h, k=0; wy<GROUND-40; wy+=16) for(let wx=x+7; wx<x+w-9; wx+=13, k++){
        const on = hash(i*31+k) > .45; ctx.fillStyle = on ? (hash(k+i)>.8?'#9fe3ff':'#ffd970') : '#262c55'; ctx.fillRect(wx,wy,7,8); }
      if(i%4===0){ ctx.save(); ctx.shadowColor='#3fa9ff'; ctx.shadowBlur=14; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+w/2,GROUND-30-h-18,16,0,7); ctx.fill(); ctx.restore(); logo(x+w/2,GROUND-30-h-18,30); }
    } else if(lv.mid==='trees'){
      const h=50+r*50, cx=x+seg/2;

  const hx=sh.x+9, hy=sh.y-13;
  ctx.fillStyle='#f1c7a3'; ctx.beginPath(); ctx.arc(hx,hy,10,0,7); ctx.fill();
  ctx.fillStyle='#4a2e1c'; ctx.beginPath(); ctx.moveTo(hx-6,hy+1); ctx.quadraticCurveTo(hx-5,hy+13,hx+3,hy+13); ctx.quadraticCurveTo(hx+11,hy+11,hx+10,hy+3);
  ctx.lineTo(hx+7,hy+4); ctx.quadraticCurveTo(hx+4,hy+2,hx+1,hy+4); ctx.quadraticCurveTo(hx-3,hy+3,hx-6,hy+1); ctx.fill();
  ctx.strokeStyle='#f1c7a3'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(hx+3,hy+7); ctx.lineTo(hx+7,hy+7); ctx.stroke();
  ctx.fillStyle='#111'; rr(hx+1,hy-4,10,5,2); ctx.fill();
  ctx.strokeStyle='#111'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(hx+1,hy-2); ctx.lineTo(hx-7,hy-3); ctx.stroke();
  ctx.fillStyle='rgba(120,180,255,.6)'; ctx.fillRect(hx+6,hy-3,3,1.5);
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.ellipse(hx-1,hy-5,13,8,-.15,Math.PI,0); ctx.fill(); ctx.fillRect(hx-14,hy-6,25,3);
  logo(hx-1,hy-9,10);
  ctx.restore();
}

// ---------------- HUD & panels ----------------
function hud(){
  const lv=L();
  const pw=Math.min(W-40,440), px=(W-pw)/2, py=14;
  rr(px,py,pw,14,7); ctx.fillStyle='rgba(255,255,255,.75)'; ctx.fill();
  const prog=Math.min(1,G.dist/lv.len);
  rr(px,py,Math.max(14,pw*prog),14,7); ctx.fillStyle='#1f6fc5'; ctx.fill();
  logo(px+pw,py+7,30);
  ctx.save(); ctx.translate(px+pw*prog,py+7); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill(); ctx.strokeStyle='#1f6fc5'; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
  const left=Math.max(0,Math.ceil(lv.len-G.dist));
  ctx.font='700 13px Rubik, sans-serif'; ctx.textAlign='center'; ctx.fillStyle = lv.night ? '#e6ecff' : '#0d3b73';
  ctx.fillText(`Ур. ${G.lvl+1} · ${lv.name} · ${left>0? left+' м' : 'приехали!'}`, W/2, py+32);
  ctx.textAlign='left'; ctx.font='900 20px Rubik, sans-serif';
  rr(12,50,92,30,15); ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fill();
  logo(28,65,24); ctx.fillStyle='#0d3b73'; ctx.fillText(runScore,44,72);
  const n=D().lives;
  for(let i=0;i<n;i++){ ctx.globalAlpha = i<G.lives?1:.25; heart(W-26-i*26,62); }
  ctx.globalAlpha=1;
  // level intro banner
  if(G.t < 2.2){
    const a = Math.min(1, (2.2-G.t)/.5, G.t/.25);
    ctx.globalAlpha=a; ctx.textAlign='center';
    const by = VH*0.36;
    rr(W/2-150,by-38,300,70,16); ctx.fillStyle='rgba(13,59,115,.85)'; ctx.fill();
    ctx.fillStyle='#9fd0ff'; ctx.font='700 14px Rubik, sans-serif'; ctx.fillText('УРОВЕНЬ '+(G.lvl+1)+' из '+LEVELS.length, W/2, by-14);
    ctx.fillStyle='#fff'; ctx.font='900 24px Rubik, sans-serif'; ctx.fillText(lv.name, W/2, by+16);
    ctx.globalAlpha=1;
  }
}
function panelBox(ph){
  ctx.fillStyle='rgba(8,35,70,.55)'; ctx.fillRect(0,0,W,VH);
  const pw=Math.min(W-24,440), px=(W-pw)/2, py=Math.max(8,(VH-ph)/2);
  rr(px,py,pw,ph,22); ctx.fillStyle='#fff'; ctx.fill();
  ctx.textAlign='center';
  return {px,py,pw,ph};
}
function drawMenu(){
  const {px,py,pw,ph}=panelBox(366);
  const bob=Math.sin(T*2.5)*3;
  logo(W/2,py+38+bob,58);
  ctx.fillStyle='#0d3b73'; ctx.font='900 30px Rubik, sans-serif'; ctx.fillText('Polymedic Man',W/2,py+96);
  ctx.font='500 13px Rubik, sans-serif'; ctx.fillStyle='#3a5f8a';
  ctx.fillText('Антон едет в Polymedica. Тап — прыжок, два тапа — двойной.',W/2,py+118,pw-24);
  ctx.font='700 12px Rubik, sans-serif'; ctx.fillStyle='#7a90a8'; ctx.fillText('СЛОЖНОСТЬ',W/2,py+144);
  const bw=(pw-40-16)/3;
  DIFFS.forEach((d,i)=>{
    const on=i===diff;
    btn(px+20+i*(bw+8),py+152,bw,34,d.name,()=>{ diff=i; store.set('diff',diff); beep(600,700,.05); },
      {fill:on?'#1f6fc5':'#eef4fb', color:on?'#fff':'#1f6fc5', font:'700 14px Rubik, sans-serif', dy:5, r:10});
  });
  ctx.font='700 12px Rubik, sans-serif'; ctx.fillStyle='#7a90a8'; ctx.fillText('УРОВЕНЬ',W/2,py+210);
  const n=LEVELS.length, lw=(pw-40-(n-1)*6)/n;
  LEVELS.forEach((lv,i)=>{
    const open=i<unlocked, on=i===selLevel-1, x=px+20+i*(lw+6), y=py+218;
    btn(x,y,lw,44,'',()=>{ if(open){ selLevel=i+1; beep(600,700,.05);} else beep(200,150,.1); },
      {fill: on ? '#1f6fc5' : open ? '#eef4fb' : '#f1f1f1', r:10});
    // mini sky swatch
    const g=ctx.createLinearGradient(0,y+4,0,y+24); g.addColorStop(0,lv.sky[0]); g.addColorStop(1,lv.sky[1]);
    rr(x+4,y+4,lw-8,18,6); ctx.fillStyle=open?g:'#ddd'; ctx.fill();
    ctx.fillStyle = on ? '#fff' : open ? '#1f6fc5' : '#aaa'; ctx.font='900 15px Rubik, sans-serif'; ctx.textAlign='center';
    ctx.fillText(open ? String(i+1) : '🔒', x+lw/2, y+39);
  });
  ctx.font='600 13px Rubik, sans-serif'; ctx.fillStyle='#3a5f8a';
  ctx.fillText(LEVELS[selLevel-1].name + (best? '   ·   рекорд: '+best : ''), W/2, py+284);
  btn(W/2-110,py+ph-58,220,44,'Поехали!',()=>startLevel(selLevel-1,false));
}
function drawDone(){
  const {px,py,pw,ph}=panelBox(300);
  logo(W/2,py+50,62);
  ctx.fillStyle='#1f8a4c'; ctx.font='900 24px Rubik, sans-serif'; ctx.fillText('Уровень '+(G.lvl+1)+' пройден!',W/2,py+110);
  ctx.fillStyle='#3a5f8a'; ctx.font='500 14px Rubik, sans-serif';
  ctx.fillText(`Логотипов: ${G.logos}  ·  Бонус: +${G.bonus}`,W/2,py+136);
  ctx.fillStyle='#0d3b73'; ctx.font='900 28px Rubik, sans-serif'; ctx.fillText('Счёт: '+runScore,W/2,py+176);
  ctx.font='600 13px Rubik, sans-serif'; ctx.fillStyle='#3a5f8a'; ctx.fillText('Дальше: '+LEVELS[G.lvl+1].name+' — будет сложнее',W/2,py+202,pw-20);
  btn(px+20,py+ph-60,100,42,'Меню',()=>{ state='menu'; selLevel=Math.min(unlocked,LEVELS.length); },{fill:'#eef4fb',color:'#1f6fc5',font:'700 15px Rubik, sans-serif'});
  btn(px+130,py+ph-60,pw-150,42,'Дальше →',()=>startLevel(G.lvl+1,true));
}
function drawOver(){
  const {px,py,pw,ph}=panelBox(290);
  logo(W/2,py+50,62);
  ctx.fillStyle='#c23246'; ctx.font='900 24px Rubik, sans-serif'; ctx.fillText('Антон не доехал',W/2,py+110);
  ctx.fillStyle='#3a5f8a'; ctx.font='500 14px Rubik, sans-serif';
  ctx.fillText(`Уровень ${G.lvl+1}: ${Math.floor(G.dist)} м из ${L().len}`,W/2,py+136);
  ctx.fillStyle='#0d3b73'; ctx.font='900 28px Rubik, sans-serif'; ctx.fillText('Счёт: '+runScore,W/2,py+176);
  ctx.font='700 13px Rubik, sans-serif'; ctx.fillStyle='#1f6fc5'; ctx.fillText(G.newBest?'Новый рекорд!':'Рекорд: '+best,W/2,py+200);
  btn(px+20,py+ph-60,100,42,'Меню',()=>{ state='menu'; selLevel=Math.min(unlocked,LEVELS.length); },{fill:'#eef4fb',color:'#1f6fc5',font:'700 15px Rubik, sans-serif'});
  btn(px+130,py+ph-60,pw-150,42,'Ещё раз',()=>{ runScore=levelStartScore; startLevel(G.lvl,true); });
}
function drawWin(){
  const {px,py,pw,ph}=panelBox(300);
  const bob=Math.sin(T*3)*4;
  logo(W/2-60,py+52+bob,44); logo(W/2,py+48-bob,64); logo(W/2+60,py+52+bob,44);
  ctx.fillStyle='#1f8a4c'; ctx.font='900 22px Rubik, sans-serif'; ctx.fillText('Антон объехал все Polymedica!',W/2,py+112,pw-20);
  ctx.fillStyle='#3a5f8a'; ctx.font='500 14px Rubik, sans-serif'; ctx.fillText('Сложность: '+D().name+'  ·  6 из 6 уровней',W/2,py+138);
  ctx.fillStyle='#0d3b73'; ctx.font='900 30px Rubik, sans-serif'; ctx.fillText('Счёт: '+runScore,W/2,py+180);
  ctx.font='700 13px Rubik, sans-serif'; ctx.fillStyle='#1f6fc5'; ctx.fillText(G.newBest?'Новый рекорд!':'Рекорд: '+best,W/2,py+204);
  btn(W/2-110,py+ph-60,220,42,'В меню',()=>{ state='menu'; });
  if(Math.random()<.3) G.parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*60,vy:60,life:2.5,c:['rgba(31,111,197,','rgba(229,57,80,','rgba(255,204,42,'][Math.random()*3|0]});
}

// ---------------- main loop ----------------
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  update(dt);
  const lv = state==='menu' ? LEVELS[selLevel-1] : L();
  if(state==='menu') G.lvl = selLevel-1;
  buttons=[];
  ctx.setTransform(S,0,0,S,0,OY*S);
  ctx.fillStyle=lv.road; ctx.fillRect(0,H-30,W,VH);
  if(G.shake>0) ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  drawSky(lv); drawFar(lv); drawMid(lv); drawNear(lv);
  if(state!=='menu') drawPolymedica(goalScreenX(), lv);
  drawRoad(lv);
  for(const o of G.obs){ if(o.type==='pit') drawPit(o,lv); }
  for(const o of G.obs){ if(o.type==='bump') drawBump(o,lv); else if(o.type==='bush') drawBush(o,lv); }
  for(const it of G.items) drawItem(it);
  if(!G.p.fall){ ctx.fillStyle='rgba(0,0,0,.25)'; const sh=Math.max(.3,1-(GROUND-G.p.y)/200); ctx.beginPath(); ctx.ellipse(PX,GROUND+3,40*sh,5*sh,0,0,7); ctx.fill(); }
  drawRider(lv);
  for(const q of G.parts){ ctx.fillStyle=q.c+Math.max(0,Math.min(1,q.life*1.6))+')'; ctx.fillRect(q.x-2,q.y-2,4,4); }
  for(const q of G.wx){
    if(q.a!==undefined){ ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.a); ctx.fillStyle=q.c; ctx.beginPath(); ctx.ellipse(0,0,q.r,q.r/2,0,0,7); ctx.fill(); ctx.restore(); }
    else { ctx.fillStyle='rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,7); ctx.fill(); }
  }
  ctx.textAlign='center'; ctx.font='900 16px Rubik, sans-serif';
  for(const f of G.floaters){ ctx.globalAlpha=1-f.t/.8; ctx.fillStyle=f.c; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1;
  ctx.setTransform(S,0,0,S,0,0);
  if(state==='play') hud();
  else if(state==='menu') drawMenu();
  else if(state==='done') drawDone();
  else if(state==='over') drawOver();
  else if(state==='win') drawWin();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
