  DPR = Math.min(window.devicePixelRatio||1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w*DPR); cv.height = Math.round(h*DPR);
  S = Math.min(cv.height / H, cv.width / 460); W = cv.width / S; VH = cv.height / S; OY = VH - H;
  PX = W < 600 ? 95 : 150;
}
window.addEventListener('resize', resize); resize();

// ---------- audio ----------
let ac = null;
function beep(f1, f2, dur, type='square', vol=0.08){
  if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(f2, ac.currentTime+dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+dur);
}

// ---------- state ----------
let best = 0;
try { best = +localStorage.getItem('pm_best')||0; } catch(e){}

let state = 'menu'; // menu | play | over | win
let G;
function newGame(){
  G = {
    dist:0, speed:260, t:0, score:0, lives:3, inv:0,
    p:{y:GROUND, vy:0, air:false, jumps:0, rot:0, tilt:0},
    bumps:[], coins:[], parts:[], floaters:[],
    nextBump: 500, nextCoin: 300,
    shake:0, finished:false, finishT:0
  };
}
newGame();

// ---------- input ----------
function tap(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state==='suspended') ac.resume().catch(()=>{});
  if(state==='menu'){ newGame(); state='play'; beep(400,800,.15); return; }
  if(state==='over' || state==='win'){ if(G.t > (G.endAt||0)+0.6){ newGame(); state='play'; beep(400,800,.15);} return; }
  if(state==='play' && !G.finished){
    const p = G.p;
    if(!p.air){ p.vy = -560; p.air = true; p.jumps = 1; beep(300,700,.12); dust(150, GROUND, 6); }
    else if(p.jumps < 2){ p.vy = -470; p.jumps = 2; beep(500,1000,.1); }
  }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(); });
window.addEventListener('keydown', e => { if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'){ e.preventDefault(); tap(); }});

// ---------- helpers ----------
function dust(x,y,n,color){
  for(let i=0;i<n;i++) G.parts.push({x,y,vx:-60-Math.random()*120,vy:-Math.random()*120,life:.5+Math.random()*.3,c:color||'rgba(180,160,130,'});
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }
function logo(x,y,size){ if(LOGO.complete) ctx.drawImage(LOGO, x-size/2, y-size/2, size, size); }
function bumpH(b, x){ // height of bump at world-screen x
  const u = (x - b.x)/b.w; if(u<0||u>1) return 0;
  return Math.sin(u*Math.PI)*b.h;
}

// ---------- update ----------
function update(dt){
  G.t += dt;
  if(state!=='play') { updParts(dt); return; }
  const p = G.p;
  if(G.finished){
    G.finishT += dt;
    G.speed = Math.max(0, G.speed - 300*dt);
  } else {
    G.speed = Math.min(560, 260 + G.dist*0.18);
  }
  const dx = G.speed*dt;
  G.dist += dx/PX_PER_M;

  // spawn
  const goalX = (GOAL - G.dist)*PX_PER_M + PX - 110;
  G.nextBump -= dx; G.nextCoin -= dx;
  if(G.nextBump<=0 && goalX > W+300){
    const h = 16 + Math.random()*20 + Math.min(14, G.dist/120);
    const w = 44 + Math.random()*40;
    G.bumps.push({x:W+40, w, h, hit:false});
    if(Math.random()< Math.min(.35, G.dist/3000) ) G.bumps.push({x:W+40+w+110+Math.random()*40, w:40+Math.random()*20, h:16+Math.random()*12, hit:false});
    G.nextBump = 300 + Math.random()*380 + G.speed*0.35;
  }
  if(G.nextCoin<=0 && goalX > W+200){
    const n = 1 + (Math.random()*4|0), y0 = GROUND-60-Math.random()*90, arc = Math.random()<.5;
    for(let i=0;i<n;i++) G.coins.push({x:W+30+i*42, y: y0 - (arc? Math.sin(i/(Math.max(1,n-1))*Math.PI)*40 : 0), got:false, ph:Math.random()*6});
    G.nextCoin = 260 + Math.random()*420;
  }
  for(const b of G.bumps) b.x -= dx;
  for(const c of G.coins) c.x -= dx;
  G.bumps = G.bumps.filter(b=>b.x+b.w>-50);
  G.coins = G.coins.filter(c=>c.x>-50 && !c.gone);

  // physics
  p.vy += 1500*dt; p.y += p.vy*dt;
  if(p.y >= GROUND){ if(p.air && p.vy>200) dust(PX, GROUND, 5); p.y = GROUND; p.vy = 0; p.air=false; p.jumps=0; }
  p.rot += dx/14;
  p.tilt += ((p.air ? Math.max(-.35, Math.min(.35, p.vy/1400)) : 0) - p.tilt)*Math.min(1,dt*10);
  if(G.inv>0) G.inv -= dt;

  // collisions: bumps vs wheels
  if(!G.finished){
    for(const b of G.bumps){
      if(b.hit) continue;
      const wheels = [PX-26, PX+26];
      for(const wx of wheels){
        const hh = bumpH(b, wx);
        if(hh>4 && p.y > GROUND - hh + 4){
          b.hit = true;
          if(G.inv<=0){
            G.lives--; G.inv = 1.4; G.shake = .35; beep(200,60,.35,'sawtooth',.1);
            dust(PX, GROUND-10, 14, 'rgba(120,90,60,');
            p.vy = -380; p.air = true; p.jumps = 2;
            if(G.lives<=0){ endGame(false); }
          }
          break;
        }
      }
    }
    for(const c of G.coins){
      if(c.got) continue;
      const cy = c.y + Math.sin(G.t*4+c.ph)*4;
      const py = p.y - 50;
      if(Math.abs(c.x-PX)<32 && Math.abs(cy-py)<44){
        c.got = true; c.gone = true; G.score += 10; beep(880,1600,.08,'triangle',.07);
        G.floaters.push({x:c.x,y:cy,t:0,txt:'+10'});
        for(let i=0;i<8;i++) G.parts.push({x:c.x,y:cy,vx:(Math.random()-.5)*200,vy:(Math.random()-.5)*200,life:.4,c:'rgba(60,150,230,'});
      }
    }
  }
  if(!G.finished && (GOAL-G.dist)*PX_PER_M <= G.speed*G.speed/600){ G.finished = true; }
  if(G.finished && G.speed<=0 && state==='play'){ G.score += 500; endGame(true); }
  if(G.shake>0) G.shake -= dt;
  updParts(dt);
}
function updParts(dt){
  for(const q of G.parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vy+=400*dt; q.life-=dt; }
  G.parts = G.parts.filter(q=>q.life>0);
  for(const f of G.floaters){ f.t+=dt; f.y-=40*dt; }
  G.floaters = G.floaters.filter(f=>f.t<.8);
}
function endGame(win){
  state = win ? 'win' : 'over';
  G.endAt = G.t;
  const total = G.score + Math.floor(Math.min(G.dist,GOAL));
  G.total = total;
  G.newBest = total > best;
  if(G.newBest){ best = total; try{ localStorage.setItem('pm_best', best); }catch(e){} }
  if(win){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,f,.18,'triangle',.08),i*130)); }
  else beep(300,80,.6,'sawtooth',.08);
}

// ---------- drawing ----------
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,'#5fb3ff'); g.addColorStop(1,'#d8efff');
  ctx.fillStyle = '#5fb3ff'; ctx.fillRect(0,-OY,W,OY+1);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,GROUND);
  // sun = logo
  const sy = OY>60 ? -OY*0.35 : 115, sx = OY>60 ? W-80 : W-190;
  const gl = ctx.createRadialGradient(sx,sy,10,sx,sy,70); gl.addColorStop(0,'rgba(255,250,200,.9)'); gl.addColorStop(1,'rgba(255,250,200,0)');
  ctx.fillStyle=gl; ctx.beginPath(); ctx.arc(sx,sy,70,0,7); ctx.fill();
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(G.t*0.3); logo(0,0,64); ctx.restore();
  // blimp
  const bx = ((W+200) - (G.t*25 % (W+400))), by = OY>60 ? -OY*0.7+20 : 120;
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(bx,by,70,24,0,0,7); ctx.fill();
  ctx.strokeStyle='#1f6fc5'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#1f6fc5'; ctx.beginPath(); ctx.moveTo(bx+60,by); ctx.lineTo(bx+84,by-18); ctx.lineTo(bx+84,by+18); ctx.closePath(); ctx.fill();
  ctx.fillRect(bx-14,by+22,28,9);
  logo(bx-38,by,34); ctx.font='900 12px Rubik, sans-serif'; ctx.textAlign='left'; ctx.fillText('POLYMEDICA',bx-18,by+5);
  // clouds
  const off = G.dist*PX_PER_M*0.05;
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<6;i++){
    const x = ((i*260 - off) % (W+300) + W+300) % (W+300) - 150, y = 40 + (i*53%90);
    ctx.beginPath(); ctx.ellipse(x,y,46,16,0,0,7); ctx.ellipse(x+28,y-10,28,18,0,0,7); ctx.ellipse(x-24,y-4,24,14,0,0,7); ctx.fill();
  }
}
function drawCity(){
  const off = G.dist*PX_PER_M*0.25;
  const seg = 70;
  const start = Math.floor(off/seg)-1;
  for(let i=start;i<start+Math.ceil(W/seg)+3;i++){
    const r = Math.abs(Math.sin(i*12.9898)*43758.5453)%1;
    const h = 60 + r*110, w = 50 + (r*37%1)*20;
    const x = i*seg - off;
    ctx.fillStyle = r>.5 ? '#9cc3e6' : '#86b1d9';
    ctx.fillRect(x, GROUND-30-h, w, h+30);
    ctx.fillStyle='rgba(255,255,255,.45)';
    for(let wy=GROUND-20-h; wy<GROUND-40; wy+=18) for(let wx=x+8; wx<x+w-10; wx+=14) ctx.fillRect(wx,wy,7,9);
    if(i%5===0) logo(x+w/2, GROUND-30-h-16, 26); // logos on rooftops
  }
}
function drawBillboards(){
  const off = G.dist*PX_PER_M*0.6;
  const seg = 520;
  const start = Math.floor(off/seg)-1;
  for(let i=start;i<start+Math.ceil(W/seg)+2;i++){
    const x = i*seg - off + 200;
    ctx.fillStyle='#5a6b7d'; ctx.fillRect(x+44, GROUND-70, 8, 70); ctx.fillRect(x+108, GROUND-70, 8, 70);
    rr(x-10, GROUND-150, 186, 84, 8); ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#1f6fc5'; ctx.lineWidth=4; ctx.stroke();
    logo(x+38, GROUND-108, 60);
    ctx.fillStyle='#1f6fc5'; ctx.font='900 17px Rubik, sans-serif'; ctx.textAlign='left';
    ctx.fillText(i%2? 'POLYMEDICA':'ЗДОРОВЬЕ', x+70, GROUND-112);
    ctx.font='700 11px Rubik, sans-serif'; ctx.fillStyle='#4a7fb6';
    ctx.fillText(i%2? 'уже близко!':'рядом с вами', x+72, GROUND-94);
  }
}
function drawRoad(){
  ctx.fillStyle='#7cc56a'; ctx.fillRect(0,GROUND-6,W,8);
  ctx.fillStyle='#3d4450'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#2f353f'; ctx.fillRect(0,GROUND,W,6);
  const off = (G.dist*PX_PER_M) % 60;
  ctx.fillStyle='#f4f4f4';
  for(let x=-off; x<W; x+=60) ctx.fillRect(x, GROUND+38, 32, 5);
  ctx.fillStyle='#5a6270'; ctx.fillRect(0,H-22,W,22);
  // logos painted on curb
  const off2 = (G.dist*PX_PER_M) % 300;
  for(let x=-off2; x<W+50; x+=300) logo(x+150, H-11, 18);
}
function drawBump(b){
  ctx.fillStyle='#8a5a33';
  ctx.beginPath(); ctx.moveTo(b.x, GROUND+2);
  for(let i=0;i<=16;i++){ const u=i/16; ctx.lineTo(b.x+u*b.w, GROUND - Math.sin(u*Math.PI)*b.h); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#a8723f';
  ctx.beginPath(); ctx.moveTo(b.x+b.w*.15, GROUND);
  for(let i=0;i<=12;i++){ const u=.15+.7*i/12; ctx.lineTo(b.x+u*b.w, GROUND - Math.sin(u*Math.PI)*b.h*.75); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#6b4325';
  ctx.beginPath(); ctx.arc(b.x+b.w*.4, GROUND-b.h*.5, 2.5,0,7); ctx.arc(b.x+b.w*.65, GROUND-b.h*.35, 2,0,7); ctx.fill();
}
function drawCoin(c){
  const y = c.y + Math.sin(G.t*4+c.ph)*4;
  const sx = Math.abs(Math.cos(G.t*3+c.ph))*.3+.7;
  ctx.save(); ctx.translate(c.x,y); ctx.scale(sx,1);
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(0,0,19,0,7); ctx.fill();
  logo(0,0,34); ctx.restore();
}
function drawWheel(x,y,r,rot){
  ctx.strokeStyle='#1d1f24'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke();
  ctx.strokeStyle='#bfc6cf'; ctx.lineWidth=1.3;
  for(let i=0;i<6;i++){ const a=rot+i*Math.PI/3; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*(r-3), y+Math.sin(a)*(r-3)); ctx.stroke(); }
  ctx.fillStyle='#888'; ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill();
}
function drawRider(){
  const p = G.p;
  if(G.inv>0 && Math.floor(G.inv*12)%2===0 && state==='play') return;
  ctx.save();
  ctx.translate(PX, p.y);
  ctx.rotate(p.tilt);
  // shadow handled outside
  const r = 17, wy = -r;
  // frame
  const rearX=-26, frontX=26;
  const crankX=-4, crankY=wy;
  const seatX=-12, seatY=-56, barX=18, barY=-60;
  drawWheel(rearX, wy, r, p.rot); drawWheel(frontX, wy, r, p.rot);
  ctx.strokeStyle='#1f6fc5'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(rearX,wy); ctx.lineTo(crankX,crankY); ctx.lineTo(barX-4,barY+10); ctx.lineTo(seatX+2,seatY+8); ctx.lineTo(rearX,wy);
  ctx.moveTo(crankX,crankY); ctx.lineTo(seatX+2,seatY+8);
  ctx.moveTo(barX-4,barY+10); ctx.lineTo(frontX,wy);
  ctx.stroke();
  ctx.strokeStyle='#222'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(seatX-6,seatY+6); ctx.lineTo(seatX+8,seatY+6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(barX-4,barY+10); ctx.lineTo(barX,barY); ctx.lineTo(barX+7,barY+2); ctx.stroke();
  // pedals
  const ca = p.rot*0.8;
  const pf = {x:crankX+Math.cos(ca)*9, y:crankY+Math.sin(ca)*9};
  const pb = {x:crankX-Math.cos(ca)*9, y:crankY-Math.sin(ca)*9};
  const hip = {x:seatX+2, y:seatY};
  function leg(pd, col){
    // simple IK: knee forward-up
    const dx=pd.x-hip.x, dy=pd.y-hip.y, d=Math.min(Math.hypot(dx,dy), 43.9);
    const a=Math.atan2(dy,dx), L=22, k=Math.acos(Math.min(1,d/(2*L)));
    const knee={x:hip.x+Math.cos(a-k)*L, y:hip.y+Math.sin(a-k)*L};
    const mid={x:hip.x+(knee.x-hip.x)*.75, y:hip.y+(knee.y-hip.y)*.75};
    ctx.strokeStyle=col; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(mid.x,mid.y); ctx.lineTo(knee.x,knee.y); ctx.lineTo(pd.x,pd.y); ctx.stroke();
    ctx.strokeStyle='#111'; ctx.lineWidth=9;
    ctx.beginPath(); ctx.moveTo(hip.x,hip.y); ctx.lineTo(mid.x,mid.y); ctx.stroke();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.ellipse(pd.x+2,pd.y,5,3,0,0,7); ctx.fill();
  }
  leg(pb,'#d9ab88');
  // body
  const sh = {x:6, y:-86};
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=15;
  ctx.beginPath(); ctx.moveTo(hip.x,hip.y-2); ctx.lineTo(sh.x,sh.y); ctx.stroke();
  ctx.strokeStyle='#1f6fc5'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(hip.x-5,hip.y-6); ctx.lineTo(sh.x-6,sh.y+2); ctx.stroke();
  // logo on jersey
  ctx.save(); ctx.translate((hip.x+sh.x)/2+2, (hip.y+sh.y)/2); ctx.rotate(0.45); logo(0,0,15); ctx.restore();
  leg(pf,'#f1c7a3');
  // arm
  ctx.strokeStyle='#f1c7a3'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(sh.x+2,sh.y+4); ctx.lineTo(barX-2,barY-8); ctx.lineTo(barX+5,barY+1); ctx.stroke();
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(sh.x+2,sh.y+3); ctx.lineTo(sh.x+8,sh.y+10); ctx.stroke();
  // head
  const hx=sh.x+9, hy=sh.y-13;
  ctx.fillStyle='#f1c7a3'; ctx.beginPath(); ctx.arc(hx,hy,10,0,7); ctx.fill();
  // beard
  ctx.fillStyle='#4a2e1c';
  ctx.beginPath(); ctx.moveTo(hx-6,hy+1); ctx.quadraticCurveTo(hx-5,hy+13,hx+3,hy+13); ctx.quadraticCurveTo(hx+11,hy+11,hx+10,hy+3);
  ctx.lineTo(hx+7,hy+4); ctx.quadraticCurveTo(hx+4,hy+2,hx+1,hy+4); ctx.quadraticCurveTo(hx-3,hy+3,hx-6,hy+1); ctx.fill();
  ctx.strokeStyle='#f1c7a3'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(hx+3,hy+7); ctx.lineTo(hx+7,hy+7); ctx.stroke();
  // glasses
  ctx.fillStyle='#111'; rr(hx+1,hy-4,10,5,2); ctx.fill();
  ctx.strokeStyle='#111'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(hx+1,hy-2); ctx.lineTo(hx-7,hy-3); ctx.stroke();
  ctx.fillStyle='rgba(120,180,255,.6)'; ctx.fillRect(hx+6,hy-3,3,1.5);
  // helmet
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.ellipse(hx-1,hy-5,13,8,-.15,Math.PI,0); ctx.fill();
  ctx.fillRect(hx-14,hy-6,25,3);
  logo(hx-1,hy-9,10);
  // name tag
  ctx.restore();
}
function drawPolymedica(goalX){
  if(goalX > W+400) return;
  const x = goalX, w = 280, h = 190;
  ctx.fillStyle='#e9f3fc'; ctx.fillRect(x, GROUND-h, w, h);
  ctx.fillStyle='#1f6fc5'; ctx.fillRect(x-8, GROUND-h-12, w+16, 16);
  ctx.fillStyle='#bcd8f2';
  for(let r=0;r<3;r++) for(let c=0;c<5;c++) ctx.fillRect(x+18+c*52, GROUND-h+70+r*34, 34, 22);
  // door
  ctx.fillStyle='#9fd0ff'; ctx.fillRect(x+110, GROUND-62, 60, 62);
  ctx.strokeStyle='#1f6fc5'; ctx.lineWidth=3; ctx.strokeRect(x+110, GROUND-62, 60, 62);
  ctx.beginPath(); ctx.moveTo(x+140,GROUND-62); ctx.lineTo(x+140,GROUND); ctx.stroke();
  // sign
  rr(x+20, GROUND-h-74, w-40, 56, 10); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#1f6fc5'; ctx.lineWidth=4; ctx.stroke();
  logo(x+52, GROUND-h-46, 50);
  ctx.fillStyle='#1f6fc5'; ctx.font='900 26px Rubik, sans-serif'; ctx.textAlign='left';
  ctx.fillText('POLYMEDICA', x+82, GROUND-h-36);
  // flags
  logo(x-30, GROUND-130, 44); logo(x+w+30, GROUND-130, 44);
  // finish line on road
  for(let i=0;i<8;i++){ ctx.fillStyle = i%2? '#fff':'#111'; ctx.fillRect(x+90, GROUND+i*10, 10, 10); ctx.fillStyle = i%2? '#111':'#fff'; ctx.fillRect(x+100, GROUND+i*10, 10, 10); }
}
function hud(){
  // progress
  const pw = Math.min(W-40, 460), px = (W-pw)/2, py = 16;
  rr(px, py, pw, 14, 7); ctx.fillStyle='rgba(255,255,255,.7)'; ctx.fill();
  const prog = Math.min(1, G.dist/GOAL);
  rr(px, py, Math.max(14,pw*prog), 14, 7); ctx.fillStyle='#1f6fc5'; ctx.fill();
  logo(px+pw, py+7, 30);
  ctx.save(); ctx.translate(px+pw*prog, py+7); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill(); ctx.strokeStyle='#1f6fc5'; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
  ctx.font='700 13px Rubik, sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#0d3b73';
  const left = Math.max(0, Math.ceil(GOAL-G.dist));
  ctx.fillText(left>0 ? `До Polymedica: ${left} м` : 'Приехали!', W/2, py+32);
  // score
  ctx.textAlign='left'; ctx.font='900 20px Rubik, sans-serif'; ctx.fillStyle='#0d3b73';
  logo(26, 66, 28); ctx.fillText(G.score, 44, 73);
  // lives
  for(let i=0;i<3;i++){ ctx.globalAlpha = i<G.lives ? 1 : .2; drawHeart(W-30-i*28, 62); }
  ctx.globalAlpha=1;
}
function drawHeart(x,y){
  ctx.fillStyle='#e53950'; ctx.beginPath();
  ctx.moveTo(x,y+8); ctx.bezierCurveTo(x-14,y-2,x-8,y-12,x,y-5); ctx.bezierCurveTo(x+8,y-12,x+14,y-2,x,y+8); ctx.fill();
}
function panel(lines, btn){
  ctx.fillStyle='rgba(8,35,70,.55)'; ctx.fillRect(0,0,W,VH);
  const pw = Math.min(W-30, 420), ph = 300, px=(W-pw)/2, py=(VH-ph)/2;
  rr(px,py,pw,ph,22); ctx.fillStyle='#fff'; ctx.fill();
  ctx.textAlign='center';
  lines(px,py,pw,ph);
  const pulse = 1+Math.sin(G.t*5)*.04;
  ctx.save(); ctx.translate(W/2, py+ph-38); ctx.scale(pulse,pulse);
  rr(-110,-22,220,44,22); ctx.fillStyle='#1f6fc5'; ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 18px Rubik, sans-serif'; ctx.fillText(btn,0,6); ctx.restore();
}

let last = performance.now();
function frame(now){
  const dt = Math.min(.033, (now-last)/1000); last = now;
  update(dt);
  ctx.setTransform(S,0,0,S,0,OY*S);
  if(G.shake>0) ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  drawSky(); drawCity(); drawBillboards();
  const goalX = (GOAL - G.dist)*PX_PER_M + PX - 110;
  drawPolymedica(goalX);
  drawRoad();
  for(const b of G.bumps) drawBump(b);
  for(const c of G.coins) drawCoin(c);
  // shadow
  ctx.fillStyle='rgba(0,0,0,.25)'; const sh = Math.max(.3, 1-(GROUND-G.p.y)/200);
  ctx.beginPath(); ctx.ellipse(PX, GROUND+3, 40*sh, 5*sh, 0,0,7); ctx.fill();
  drawRider();
  for(const q of G.parts){ ctx.fillStyle=q.c+Math.max(0,q.life*1.6)+')'; ctx.fillRect(q.x-2,q.y-2,4,4); }
  ctx.textAlign='center'; ctx.font='900 16px Rubik, sans-serif';
  for(const f of G.floaters){ ctx.globalAlpha=1-f.t/.8; ctx.fillStyle='#1f6fc5'; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1;
  ctx.setTransform(S,0,0,S,0,0);
  if(state==='play') hud();

  if(state==='menu'){
    panel((px,py,pw)=>{
      const bob = Math.sin(G.t*2.5)*4;
      logo(W/2, py+70+bob, 96);
      ctx.fillStyle='#0d3b73'; ctx.font='900 34px Rubik, sans-serif'; ctx.fillText('Polymedic Man', W/2, py+150);
      ctx.font='500 14px Rubik, sans-serif'; ctx.fillStyle='#3a5f8a';
      ctx.fillText('Антон едет в Polymedica на велосипеде.', W/2, py+178);
      ctx.fillText('Тап — прыжок, двойной тап — двойной прыжок.', W/2, py+198);
      if(best) { ctx.font='700 13px Rubik, sans-serif'; ctx.fillStyle='#1f6fc5'; ctx.fillText('Рекорд: '+best, W/2, py+222); }
    }, 'Поехали!');
  }
  if(state==='over' || state==='win'){
    const win = state==='win';
    panel((px,py)=>{
      logo(W/2, py+60, 70);
      ctx.fillStyle = win ? '#1f8a4c' : '#c23246'; ctx.font='900 26px Rubik, sans-serif';
      ctx.fillText(win ? 'Антон доехал до Polymedica!' : 'Антон упал в кочку', W/2, py+122);
      ctx.fillStyle='#3a5f8a'; ctx.font='500 15px Rubik, sans-serif';
      ctx.fillText(win ? 'Бонус за доставку: +500' : `Проехал ${Math.floor(G.dist)} м из ${GOAL}`, W/2, py+150);
      ctx.fillStyle='#0d3b73'; ctx.font='900 30px Rubik, sans-serif';
      ctx.fillText('Счёт: '+G.total, W/2, py+192);
      ctx.font='700 13px Rubik, sans-serif'; ctx.fillStyle='#1f6fc5';
      ctx.fillText(G.newBest ? 'Новый рекорд!' : 'Рекорд: '+best, W/2, py+216);
    }, 'Ещё раз');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
